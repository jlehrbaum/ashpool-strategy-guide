<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wing Fighter Strategy Guide</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222538;
    --border: #2e3250;
    --accent: #6c8ef5;
    --accent2: #e07b54;
    --text: #e2e4f0;
    --text-muted: #8b90b0;
    --text-dim: #5a5f7a;
    --highlight: #ffe58a;
    --sidebar-w: 280px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.7;
    display: flex;
    min-height: 100vh;
  }

  /* ── Sidebar ── */
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #sidebar-header h2 {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  #search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 7px 10px;
    outline: none;
    font-family: var(--font);
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }

  #search-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 6px;
    min-height: 1.2em;
  }

  #toc {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0 16px;
  }

  .toc-item {
    display: block;
    font-size: 0.83rem;
    color: var(--text-muted);
    text-decoration: none;
    padding: 4px 12px;
    line-height: 1.4;
    border-left: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .toc-item:hover {
    color: var(--text);
    background: var(--surface2);
  }
  .toc-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(108,142,245,0.07);
  }
  .toc-level-1 {
    font-weight: 600;
    color: var(--text);
    margin-top: 8px;
    font-size: 0.85rem;
  }
  .toc-level-2 { }
  .toc-level-3 { color: var(--text-dim); font-size: 0.8rem; }

  /* ── Main content ── */
  #main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-width: 0;
    padding: 48px 56px 80px 56px;
    max-width: calc(var(--sidebar-w) + 760px);
  }

  /* Title block */
  .title-block {
    margin-bottom: 48px;
    padding: 32px 36px 28px;
    background: linear-gradient(135deg, #1a1d35 0%, #1e2140 60%, #1a2030 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  .title-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 50%, var(--accent2) 100%);
  }
  .doc-eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-eyebrow::after {
    content: '';
    flex: 1;
    max-width: 40px;
    height: 1px;
    background: var(--accent);
    opacity: 0.4;
  }
  .doc-title {
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .doc-tagline {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .doc-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .doc-chip {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(108,142,245,0.12);
    border: 1px solid rgba(108,142,245,0.3);
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .doc-meta {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
    font-style: italic;
  }
  /* Content links */
  #content a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(108,142,245,0.5);
    text-underline-offset: 2px;
  }
  #content a:visited { color: #b19ded; text-decoration-color: rgba(177,157,237,0.5); }
  #content a:hover { text-decoration-color: currentColor; }

  /* Semantic callouts */
  .callout {
    margin: 1em 0 1.4em;
    padding: 12px 16px 12px 18px;
    border-radius: 6px;
    border-left: 4px solid;
    font-size: 0.95rem;
  }
  .callout-cap {
    border-left-color: #e05a3a;
    background: rgba(224,90,58,0.07);
  }
  .callout-synergy {
    border-left-color: #4ab8d0;
    background: rgba(74,184,208,0.07);
  }
  .callout-label {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 6px;
    opacity: 0.85;
  }
  .callout-cap .callout-label { color: #e8886c; }
  .callout-synergy .callout-label { color: #6ac5db; }

  /* Mobile TOC drawer */
  #toc-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  #toc-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 998;
  }
  .doc-byline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .doc-author {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .doc-author::before {
    content: 'by ';
    font-weight: 400;
    color: var(--text-dim);
  }
  .doc-legion {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    border-left: 1px solid var(--border);
    padding-left: 12px;
  }

  /* Headings */
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin: 2.4em 0 0.6em;
    padding-top: 0.5em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4em;
    letter-spacing: -0.01em;
    scroll-margin-top: 24px;
  }
  h2 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    margin: 1.8em 0 0.5em;
    scroll-margin-top: 24px;
  }
  h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin: 1.4em 0 0.4em;
    scroll-margin-top: 24px;
  }

  /* Body text */
  p {
    margin-bottom: 0.85em;
    color: var(--text);
    font-size: 0.95rem;
  }

  /* Lists */
  ul {
    margin: 0.5em 0 1em 1.2em;
    padding: 0;
  }
  li {
    margin-bottom: 0.55em;
    font-size: 0.95rem;
    color: var(--text);
    padding-left: 0.3em;
  }
  li::marker { color: var(--accent2); }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    margin: 1em 0 1.6em;
    border-radius: 8px;
    border: 1px solid var(--border);
    /* Scroll-shadow affordance: fade shadows appear at the edges
       only when the table is horizontally scrollable. */
    background:
      linear-gradient(90deg, var(--bg), var(--bg)) left center,
      linear-gradient(90deg, var(--bg), var(--bg)) right center,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,0.6), transparent) left center,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,0.6), transparent) right center;
    background-repeat: no-repeat;
    background-size: 24px 100%, 24px 100%, 14px 100%, 14px 100%;
    background-attachment: local, local, scroll, scroll;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.88rem;
  }
  th {
    background: var(--surface2);
    color: var(--text);
    font-weight: 600;
    text-align: left;
    padding: 9px 14px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  /* Search highlights */
  mark {
    background: var(--highlight);
    color: #1a1a00;
    border-radius: 2px;
    padding: 0 2px;
  }

  /* Search, hide non-matching sections */
  .search-hidden { display: none; }

  /* No results */
  #no-results {
    display: none;
    text-align: center;
    color: var(--text-dim);
    margin-top: 60px;
    font-size: 0.95rem;
  }

  /* Scrollbar */
  #toc::-webkit-scrollbar { width: 4px; }
  #toc::-webkit-scrollbar-track { background: transparent; }
  #toc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 700px) {
    :root { --sidebar-w: 0px; }
    #toc-toggle { display: block; }
    #sidebar {
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 999;
      box-shadow: 2px 0 12px rgba(0,0,0,0.3);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar.open ~ #toc-overlay { display: block; }
    #main { margin-left: 0; padding: 56px 20px 60px; }
  }
</style>
</head>
<body>

<button id="toc-toggle" aria-label="Toggle contents">☰ Contents</button>
<div id="toc-overlay"></div>

<nav id="sidebar">
  <div id="sidebar-header">
    <h2>Contents</h2>
    <input type="search" id="search" placeholder="Search guide..." autocomplete="off" spellcheck="false">
    <div id="search-count"></div>
  </div>
  <div id="toc"></div>
</nav>

<main id="main">
  <div class="title-block"></div>
  <div id="content"></div>
  <div id="no-results">No results found.</div>
</main>

<script>
(function () {
  const CONTENT = document.getElementById('content');
  const TITLE_BLOCK = document.querySelector('.title-block');
  const TOC = document.getElementById('toc');
  const NO_RESULTS = document.getElementById('no-results');

  const TOC_PAD = { h1: 12, h2: 28, h3: 44 };

  function renderMeta(m) {
    const parts = [];
    if (m.eyebrow) parts.push(`<div class="doc-eyebrow">${m.eyebrow}</div>`);
    if (m.title) parts.push(`<h1 class="doc-title">${m.title}</h1>`);
    if (m.tagline) parts.push(`<p class="doc-tagline">${m.tagline}</p>`);
    if (m.chips && m.chips.length) {
      parts.push('<div class="doc-chips">' +
        m.chips.map(c => `<span class="doc-chip">${c}</span>`).join('') +
        '</div>');
    }
    if (m.metaLine) parts.push(`<p class="doc-meta">${m.metaLine}</p>`);
    if (m.author || m.legion) {
      parts.push(
        '<div class="doc-byline">' +
        (m.author ? `<span class="doc-author">${m.author}</span>` : '') +
        (m.legion ? `<span class="doc-legion">${m.legion}</span>` : '') +
        '</div>'
      );
    }
    TITLE_BLOCK.innerHTML = parts.join('\n');
  }

  function renderList(block) {
    const tag = block.type; // ul or ol
    const items = (block.items || []).map(item => {
      let html = `<li>${item.html || ''}`;
      if (item.nested && item.nested.length) {
        item.nested.forEach(n => { html += renderList(n); });
      }
      html += '</li>';
      return html;
    }).join('');
    return `<${tag}>${items}</${tag}>`;
  }

  function renderTable(block) {
    const rows = (block.rows || []).map(row => {
      const cellTag = row.header ? 'th' : 'td';
      const cells = row.cells.map(c => `<${cellTag}>${c}</${cellTag}>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<div class="table-wrap"><table>${rows}</table></div>`;
  }

  function renderCallout(block) {
    const label = block.label ? `<span class="callout-label">${block.label}</span>` : '';
    return `<div class="callout callout-${block.kind}">${label}${block.html || ''}</div>`;
  }

  function renderContent(blocks) {
    const html = [];
    const tocEntries = [];
    blocks.forEach(block => {
      switch (block.type) {
        case 'h1':
        case 'h2':
        case 'h3': {
          html.push(`<${block.type} id="${block.id}">${block.title}</${block.type}>`);
          tocEntries.push({ level: block.type, id: block.id, title: block.title });
          break;
        }
        case 'p':
          html.push(`<p>${block.html}</p>`);
          break;
        case 'ul':
        case 'ol':
          html.push(renderList(block));
          break;
        case 'table':
          html.push(renderTable(block));
          break;
        case 'callout':
          html.push(renderCallout(block));
          break;
      }
    });
    CONTENT.innerHTML = html.join('\n');
    return tocEntries;
  }

  function renderToc(entries) {
    TOC.innerHTML = entries.map(e => {
      const pad = TOC_PAD[e.level] || 12;
      const level = e.level.slice(1); // "1","2","3"
      return `<a href="#${e.id}" class="toc-item toc-level-${level}" style="padding-left:${pad}px">${e.title}</a>`;
    }).join('\n');
  }

  function wireUp() {
    const headings = Array.from(document.querySelectorAll('h1[id], h2[id], h3[id]'));
    const tocLinks = Array.from(document.querySelectorAll('.toc-item'));

    function setActive(id) {
      tocLinks.forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
      });
      const active = tocLinks.find(a => a.getAttribute('href') === '#' + id);
      if (active) {
        const top = active.offsetTop - TOC.clientHeight / 2;
        TOC.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-10% 0px -80% 0px', threshold: 0 });
    headings.forEach(h => observer.observe(h));

    // Deep-link details handler (future-proof)
    function openDetailsForHash() {
      const hash = window.location.hash;
      if (!hash || hash.length < 2) return;
      let el;
      try { el = document.querySelector(hash); } catch (e) { return; }
      if (!el) return;
      let node = el;
      while (node && node !== document.body) {
        if (node.tagName === 'DETAILS') node.open = true;
        node = node.parentElement;
      }
      requestAnimationFrame(() => el.scrollIntoView());
    }
    openDetailsForHash();
    window.addEventListener('hashchange', openDetailsForHash);

    // Mobile drawer
    const sidebar = document.getElementById('sidebar');
    const tocToggle = document.getElementById('toc-toggle');
    const tocOverlay = document.getElementById('toc-overlay');
    function closeDrawer() { sidebar.classList.remove('open'); }
    tocToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
    tocOverlay.addEventListener('click', closeDrawer);
    tocLinks.forEach(a => a.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 700px)').matches) closeDrawer();
    }));

    // Search
    const input = document.getElementById('search');
    const countEl = document.getElementById('search-count');
    const originalHTML = CONTENT.innerHTML;

    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function highlightNode(el, re) {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      nodes.forEach(node => {
        if (!re.test(node.nodeValue)) return;
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(re, m => `<mark>${m}</mark>`);
        node.parentNode.replaceChild(span, node);
      });
    }

    function doSearch(query) {
      CONTENT.innerHTML = originalHTML;
      countEl.textContent = '';
      NO_RESULTS.style.display = 'none';
      if (!query.trim()) return;
      const q = query.trim();
      const re = new RegExp(escapeRe(q), 'gi');
      const ql = q.toLowerCase();
      const blocks = Array.from(CONTENT.children);
      let matchCount = 0;
      blocks.forEach(el => {
        if (/^H[123]$/.test(el.tagName)) return;
        if (el.textContent.toLowerCase().includes(ql)) {
          matchCount++;
          highlightNode(el, re);
        } else {
          el.classList.add('search-hidden');
        }
      });
      for (let i = 0; i < blocks.length; i++) {
        const el = blocks[i];
        if (!/^H[123]$/.test(el.tagName)) continue;
        const headingMatches = el.textContent.toLowerCase().includes(ql);
        let contentVisible = false;
        for (let j = i + 1; j < blocks.length; j++) {
          if (/^H[123]$/.test(blocks[j].tagName)) break;
          if (!blocks[j].classList.contains('search-hidden')) { contentVisible = true; break; }
        }
        if (!headingMatches && !contentVisible) {
          el.classList.add('search-hidden');
        } else if (headingMatches) {
          matchCount++;
          highlightNode(el, re);
        }
      }
      if (matchCount === 0) {
        NO_RESULTS.style.display = 'block';
      } else {
        countEl.textContent = matchCount + ' match' + (matchCount !== 1 ? 'es' : '');
      }
    }

    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => doSearch(input.value), 180);
    });
  }

  async function init() {
    try {
      const resp = await fetch('./guide.json', { cache: 'no-cache' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const guide = await resp.json();
      renderMeta(guide.meta || {});
      const tocEntries = renderContent(guide.content || []);
      renderToc(tocEntries);
      wireUp();
    } catch (err) {
      CONTENT.innerHTML = '<p style="color:#e05a3a">Could not load guide content: ' + err.message +
        '. If you\'re opening this file directly, use a local web server so fetch can read guide.json.</p>';
      console.error(err);
    }
  }

  init();
})();
</script>
</body>
</html>
